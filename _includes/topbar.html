{% assign ui = site.data.ui[page.book_lang] %}
<header class="topbar">
  <button class="icon-btn drawer-btn" id="drawerBtn" aria-label="Menu">
    <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5h14M3 10h14M3 15h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="{{ '/' | relative_url }}?home=1">
    <svg class="brand-mark" width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><circle cx="10" cy="6" r="3.4" fill="#e8590c"/><circle cx="10" cy="26" r="3.4" fill="#2b8a3e"/><circle cx="23" cy="16" r="3.4" fill="#1971c2"/><path d="M10 9.4V22.6M10 16c5.5 0 6.5 0 9.5 0" stroke="currentColor" stroke-width="2.2" fill="none" opacity=".55"/></svg>
    <span class="brand-text">{{ ui.book_title }}</span>
  </a>
  <div class="top-actions">
    <div class="lang-switch">
      <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.7 2.6 4 5.6 4 9s-1.3 6.4-4 9c-2.7-2.6-4-5.6-4-9s1.3-6.4 4-9z"/></svg>
        <span>{% case page.book_lang %}{% when 'zh-tw' %}繁體中文{% when 'zh-cn' %}简体中文{% when 'en' %}English{% when 'fa' %}فارسی{% endcase %}</span>
        <svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 3.5 5 6.5 8 3.5" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </button>
      <div class="lang-menu" id="langMenu" role="menu">
        <a href="#" data-set-lang="zh-tw" role="menuitem">繁體中文 <span class="lang-note">正體中文</span></a>
        <a href="#" data-set-lang="zh-cn" role="menuitem">简体中文 <span class="lang-note">Simplified</span></a>
        <a href="#" data-set-lang="en" role="menuitem">English</a>
        <a href="#" data-set-lang="fa" role="menuitem">فارسی <span class="lang-note">Persian</span></a>
      </div>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Theme">
      <svg class="ic-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="ic-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    </button>
    <a class="icon-btn" href="https://github.com/doggy8088/Learn-Git-in-30-days" target="_blank" rel="noopener" aria-label="GitHub">
      <svg width="19" height="19" viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
    </a>
  </div>
</header>
<div class="progress" id="progress"></div>
