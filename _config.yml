title: "30 天精通 Git 版本控管"
description: "《30 天精通 Git 版本控管》— Will 保哥 (黃保翕) 於 2013 第 6 屆 iT 邦幫忙鐵人賽的年度大獎作品，現有十種語言版本：繁體中文、简体中文、English、فارسی、日本語、한국어、Tiếng Việt、ภาษาไทย、Bahasa Indonesia、Bahasa Melayu。"
baseurl: "/Learn-Git-in-30-days"
url: "https://doggy8088.github.io"
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge
plugins:
  - jekyll-optional-front-matter
  - jekyll-readme-index
  - jekyll-relative-links
  - jekyll-titles-from-headings
  - jekyll-default-layout
defaults:
  - scope:
      path: ""
    values:
      layout: "book"
      book_lang: "zh-tw"
      html_lang: "zh-TW"
      text_dir: "ltr"
  - scope:
      path: "zh-tw"
    values:
      layout: "book"
      book_lang: "zh-tw"
      html_lang: "zh-TW"
      text_dir: "ltr"
  - scope:
      path: "zh-cn"
    values:
      layout: "book"
      book_lang: "zh-cn"
      html_lang: "zh-CN"
      text_dir: "ltr"
  - scope:
      path: "en"
    values:
      layout: "book"
      book_lang: "en"
      html_lang: "en"
      text_dir: "ltr"
  - scope:
      path: "fa"
    values:
      layout: "book"
      book_lang: "fa"
      html_lang: "fa"
      text_dir: "rtl"
  - scope:
      path: "ja"
    values:
      layout: "book"
      book_lang: "ja"
      html_lang: "ja"
      text_dir: "ltr"
  - scope:
      path: "ko"
    values:
      layout: "book"
      book_lang: "ko"
      html_lang: "ko"
      text_dir: "ltr"
  - scope:
      path: "vi"
    values:
      layout: "book"
      book_lang: "vi"
      html_lang: "vi"
      text_dir: "ltr"
  - scope:
      path: "th"
    values:
      layout: "book"
      book_lang: "th"
      html_lang: "th"
      text_dir: "ltr"
  - scope:
      path: "id"
    values:
      layout: "book"
      book_lang: "id"
      html_lang: "id"
      text_dir: "ltr"
  - scope:
      path: "ms"
    values:
      layout: "book"
      book_lang: "ms"
      html_lang: "ms"
      text_dir: "ltr"
exclude:
  - en/PROOFREADING_PLAN.md
  - en/PROOFREADING_SUMMARY.md
  - linkchecker-result.html
